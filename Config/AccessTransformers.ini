[AccessTransformers]
; v1.0.44 -- HUB reward-panel display logic lives in the game's BP_UnlockRecipe blueprint graphs
; (UFGUnlock is Blueprintable and its GetWorld() comment says unlocks spawn widgets from BP).
; Native C++ UFGUnlockRecipe instances have no BP graphs, so the HUB shows an empty Rewards
; panel for our milestones (cost + icons don't go through the unlock BP, which is why they worked).
; Fix: instantiate the game's BP_UnlockRecipe_C class for each milestone, then fill mRecipes /
; mUnlocks -- both protected on the native classes, hence these Friend declarations.
Friend=(Class="UFGUnlockRecipe", FriendClass="UWirelessPowerTierUnlock")
Friend=(Class="UFGSchematic", FriendClass="UWirelessPowerTierUnlock")
